<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SupplyCollect - Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="fullpage-top">
        <a href="index.html" class="back-btn">&larr; Back to home</a>
    </div>
    <div class="fullpage-content">
        <h2>Sign Up</h2>
        <div class="error-text" id="signupError"></div>
        <input type="text" id="signupName" placeholder="Full Name">
        <input type="email" id="signupEmail" placeholder="Email">
        <input type="password" id="signupPassword" placeholder="Password">
        <button class="submit-btn" onclick="signUpAndRedirect()">Create Account</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
