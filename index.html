<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassDroper</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #F9FAFB;
        }

        /* Nav bar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: white;
            padding: 15px 30px;
            border-bottom: 2px solid #eee;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #3B82F6;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .btn-login {
            background-color: white;
            color: #3B82F6;
            border: 2px solid #3B82F6;
        }

        .btn-signup {
            background-color: #F97316;
            color: white;
        }

        /* User bubble (shown after login) */
        .user-bubble {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: #EFF6FF;
            padding: 6px 14px;
            border-radius: 20px;
            color: #3B82F6;
            font-weight: bold;
            cursor: pointer;
        }

        .account-icon {
            width: 28px;
            height: 28px;
            background-color: #3B82F6;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        /* Hero section */
        .hero {
            text-align: center;
            padding: 80px 20px;
        }

        .hero h1 {
            font-size: 2.5rem;
            color: #111827;
        }

        .hero p {
            font-size: 1.1rem;
            color: #555;
            margin-top: 10px;
        }

        /* Full screen page (login/signup/account) */
        .fullpage {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: white;
            z-index: 100;
            overflow-y: auto;
        }

        .fullpage.active {
            display: block;
        }

        .fullpage-top {
            padding: 20px 30px;
        }

        .back-btn {
            background: none;
            border: none;
            font-size: 1rem;
            color: #3B82F6;
            cursor: pointer;
        }

        .fullpage-content {
            max-width: 350px;
            margin: 40px auto 0 auto;
            padding: 0 20px;
        }

        .fullpage-content h2 {
            color: #3B82F6;
            font-size: 2rem;
        }

        .fullpage-content input {
            width: 100%;
            padding: 12px;
            margin-bottom: 14px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
        }

        .fullpage-content label {
            font-size: 0.85rem;
            color: #555;
            font-weight: bold;
        }

        button.submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #3B82F6;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            margin-bottom: 25px;
        }

        .error-text {
            color: red;
            font-size: 0.85rem;
            margin-bottom: 10px;
        }

        .success-text {
            color: green;
            font-size: 0.85rem;
            margin-bottom: 10px;
        }

        .account-section {
            border-top: 1px solid #eee;
            padding-top: 20px;
            margin-top: 10px;
        }

        .delete-btn {
            display: block;
            width: 200px;
            margin: 40px auto;
            padding: 14px;
            background-color: #DC2626;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }

        /* Confirm delete overlay */
        .confirm-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        .confirm-overlay.active {
            display: flex;
        }

        .confirm-box {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
        }

        .confirm-box p {
            margin-bottom: 20px;
        }

        .confirm-buttons {
            display: flex;
            gap: 10px;
        }

        .confirm-buttons button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .confirm-cancel {
            background-color: #eee;
        }

        .confirm-delete {
            background-color: #DC2626;
            color: white;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">ClassDroper</div>
        <div class="nav-buttons" id="navButtons">
            <button class="btn btn-login" onclick="openPage('login')">Login</button>
            <button class="btn btn-signup" onclick="openPage('signup')">Sign Up</button>
        </div>
    </nav>

    <div class="hero">
        <h1>Snacks and stationary, dropped right to your class</h1>
        <p>Order what you need, a drone delivers it straight to your classroom door.</p>
    </div>

    <!-- Sign Up Full Page -->
    <div class="fullpage" id="signupPage">
        <div class="fullpage-top">
            <button class="back-btn" onclick="closePage('signup')">&larr; Back to home</button>
        </div>
        <div class="fullpage-content">
            <h2>Sign Up</h2>
            <div class="error-text" id="signupError"></div>
            <input type="text" id="signupName" placeholder="Full Name">
            <input type="email" id="signupEmail" placeholder="Email">
            <input type="password" id="signupPassword" placeholder="Password">
            <button class="submit-btn" onclick="signUp()">Create Account</button>
        </div>
    </div>

    <!-- Login Full Page -->
    <div class="fullpage" id="loginPage">
        <div class="fullpage-top">
            <button class="back-btn" onclick="closePage('login')">&larr; Back to home</button>
        </div>
        <div class="fullpage-content">
            <h2>Login</h2>
            <div class="error-text" id="loginError"></div>
            <input type="email" id="loginEmail" placeholder="Email">
            <input type="password" id="loginPassword" placeholder="Password">
            <button class="submit-btn" onclick="logIn()">Login</button>
        </div>
    </div>

    <!-- Account Details Full Page -->
    <div class="fullpage" id="accountPage">
        <div class="fullpage-top">
            <button class="back-btn" onclick="closePage('account')">&larr; Back to home</button>
        </div>
        <div class="fullpage-content">
            <h2>Account Details</h2>

            <div class="account-section">
                <label>Full Name</label>
                <input type="text" id="accountName">
                <div class="error-text" id="nameError"></div>
                <div class="success-text" id="nameSuccess"></div>
                <button class="submit-btn" onclick="updateName()">Update Name</button>
            </div>

            <div class="account-section">
                <label>Email</label>
                <input type="email" id="accountEmail">
                <div class="error-text" id="emailError"></div>
                <div class="success-text" id="emailSuccess"></div>
                <button class="submit-btn" onclick="updateEmail()">Update Email</button>
            </div>

            <div class="account-section">
                <label>New Password</label>
                <input type="password" id="accountPassword" placeholder="Enter new password">
                <div class="error-text" id="passwordError"></div>
                <div class="success-text" id="passwordSuccess"></div>
                <button class="submit-btn" onclick="updatePassword()">Update Password</button>
            </div>

            <button class="delete-btn" onclick="openDeleteConfirm()">Delete Account</button>
        </div>
    </div>

    <!-- Delete confirmation popup -->
    <div class="confirm-overlay" id="deleteConfirm">
        <div class="confirm-box">
            <p>Are you sure you want to delete your account?</p>
            <div class="confirm-buttons">
                <button class="confirm-cancel" onclick="closeDeleteConfirm()">Cancel</button>
                <button class="confirm-delete" onclick="deleteAccount()">Delete</button>
            </div>
        </div>
    </div>

    <script>
        function openPage(type) {
            document.getElementById(type + 'Page').classList.add('active');
            if (type === 'account') {
                loadAccountDetails();
            }
        }

        function closePage(type) {
            document.getElementById(type + 'Page').classList.remove('active');
        }

        function getUsers() {
            const users = localStorage.getItem('classdroperUsers');
            return users ? JSON.parse(users) : [];
        }

        function saveUsers(users) {
            localStorage.setItem('classdroperUsers', JSON.stringify(users));
        }

        function getCurrentUser() {
            const currentUser = localStorage.getItem('classdroperCurrentUser');
            return currentUser ? JSON.parse(currentUser) : null;
        }

        function signUp() {
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim().toLowerCase();
            const password = document.getElementById('signupPassword').value;
            const errorBox = document.getElementById('signupError');

            if (!name || !email || !password) {
                errorBox.textContent = "Please fill in all fields.";
                return;
            }

            const users = getUsers();
            const existing = users.find(u => u.email === email);
            if (existing) {
                errorBox.textContent = "An account with this email already exists.";
                return;
            }

            users.push({ fullName: name, email: email, password: password });
            saveUsers(users);

            localStorage.setItem('classdroperCurrentUser', JSON.stringify({ fullName: name, email: email }));

            closePage('signup');
            updateNav();
        }

        function logIn() {
            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            const password = document.getElementById('loginPassword').value;
            const errorBox = document.getElementById('loginError');

            const users = getUsers();
            const match = users.find(u => u.email === email && u.password === password);

            if (!match) {
                errorBox.textContent = "Incorrect email or password.";
                return;
            }

            localStorage.setItem('classdroperCurrentUser', JSON.stringify({ fullName: match.fullName, email: match.email }));

            closePage('login');
            updateNav();
        }

        function loadAccountDetails() {
            const user = getCurrentUser();
            if (!user) return;
            document.getElementById('accountName').value = user.fullName;
            document.getElementById('accountEmail').value = user.email;
            document.getElementById('accountPassword').value = '';

            document.getElementById('nameError').textContent = '';
            document.getElementById('nameSuccess').textContent = '';
            document.getElementById('emailError').textContent = '';
            document.getElementById('emailSuccess').textContent = '';
            document.getElementById('passwordError').textContent = '';
            document.getElementById('passwordSuccess').textContent = '';
        }

        function updateName() {
            const newName = document.getElementById('accountName').value.trim();
            const errorBox = document.getElementById('nameError');
            const successBox = document.getElementById('nameSuccess');
            errorBox.textContent = '';
            successBox.textContent = '';

            if (!newName) {
                errorBox.textContent = "Name cannot be empty.";
                return;
            }

            const user = getCurrentUser();
            const users = getUsers();
            const index = users.findIndex(u => u.email === user.email);
            users[index].fullName = newName;
            saveUsers(users);

            localStorage.setItem('classdroperCurrentUser', JSON.stringify({ fullName: newName, email: user.email }));
            successBox.textContent = "Name updated.";
            updateNav();
        }

        function updateEmail() {
            const newEmail = document.getElementById('accountEmail').value.trim().toLowerCase();
            const errorBox = document.getElementById('emailError');
            const successBox = document.getElementById('emailSuccess');
            errorBox.textContent = '';
            successBox.textContent = '';

            if (!newEmail) {
                errorBox.textContent = "Email cannot be empty.";
                return;
            }

            const user = getCurrentUser();
            const users = getUsers();

            const emailTaken = users.find(u => u.email === newEmail && u.email !== user.email);
            if (emailTaken) {
                errorBox.textContent = "That email is already in use.";
                return;
            }

            const index = users.findIndex(u => u.email === user.email);
            users[index].email = newEmail;
            saveUsers(users);

            localStorage.setItem('classdroperCurrentUser', JSON.stringify({ fullName: user.fullName, email: newEmail }));
            successBox.textContent = "Email updated.";
        }

        function updatePassword() {
            const newPassword = document.getElementById('accountPassword').value;
            const errorBox = document.getElementById('passwordError');
            const successBox = document.getElementById('passwordSuccess');
            errorBox.textContent = '';
            successBox.textContent = '';

            if (!newPassword) {
                errorBox.textContent = "Please enter a new password.";
                return;
            }

            const user = getCurrentUser();
            const users = getUsers();
            const index = users.findIndex(u => u.email === user.email);
            users[index].password = newPassword;
            saveUsers(users);

            document.getElementById('accountPassword').value = '';
            successBox.textContent = "Password updated.";
        }

        function openDeleteConfirm() {
            document.getElementById('deleteConfirm').classList.add('active');
        }

        function closeDeleteConfirm() {
            document.getElementById('deleteConfirm').classList.remove('active');
        }

        function deleteAccount() {
            const user = getCurrentUser();
            let users = getUsers();
            users = users.filter(u => u.email !== user.email);
            saveUsers(users);

            localStorage.removeItem('classdroperCurrentUser');

            closeDeleteConfirm();
            closePage('account');
            updateNav();
        }

        function updateNav() {
            const navButtons = document.getElementById('navButtons');
            const currentUser = getCurrentUser();

            if (currentUser) {
                const initial = currentUser.fullName.charAt(0).toUpperCase();
                navButtons.innerHTML = `
                    <div class="user-bubble" onclick="openPage('account')" title="View account">
                        <div class="account-icon">${initial}</div>
                        ${currentUser.fullName}
                    </div>
                `;
            } else {
                navButtons.innerHTML = `
                    <button class="btn btn-login" onclick="openPage('login')">Login</button>
                    <button class="btn btn-signup" onclick="openPage('signup')">Sign Up</button>
                `;
            }
        }

        updateNav();
    </script>

</body>
</html>
