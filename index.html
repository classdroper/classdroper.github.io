<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassDroper</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #F9FAFB;
        }

        /* Nav bar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: white;
            padding: 15px 30px;
            border-bottom: 2px solid #eee;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #3B82F6;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .btn-login {
            background-color: white;
            color: #3B82F6;
            border: 2px solid #3B82F6;
        }

        .btn-signup {
            background-color: #F97316;
            color: white;
        }

        /* User bubble (shown after login) */
        .user-bubble {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: #EFF6FF;
            padding: 6px 14px;
            border-radius: 20px;
            color: #3B82F6;
            font-weight: bold;
        }

        .account-icon {
            width: 28px;
            height: 28px;
            background-color: #3B82F6;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        /* Hero section */
        .hero {
            text-align: center;
            padding: 80px 20px;
        }

        .hero h1 {
            font-size: 2.5rem;
            color: #111827;
        }

        .hero p {
            font-size: 1.1rem;
            color: #555;
            margin-top: 10px;
        }

        /* Modal (popup for login/signup) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            width: 300px;
        }

        .modal h2 {
            margin-top: 0;
            color: #3B82F6;
        }

        .modal input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .modal button {
            width: 100%;
            padding: 10px;
            background-color: #3B82F6;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .modal .close-btn {
            background: none;
            color: #999;
            width: auto;
            float: right;
            padding: 0;
            font-size: 1.2rem;
        }

        .error-text {
            color: red;
            font-size: 0.85rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">ClassDroper</div>
        <div class="nav-buttons" id="navButtons">
            <button class="btn btn-login" onclick="openModal('login')">Login</button>
            <button class="btn btn-signup" onclick="openModal('signup')">Sign Up</button>
        </div>
    </nav>

    <div class="hero">
        <h1>Snacks and stationary, dropped right to your class</h1>
        <p>Order what you need, a drone delivers it straight to your classroom door.</p>
    </div>

    <!-- Sign Up Modal -->
    <div class="modal-overlay" id="signupModal">
        <div class="modal">
            <button class="close-btn" onclick="closeModal('signup')">&times;</button>
            <h2>Sign Up</h2>
            <div class="error-text" id="signupError"></div>
            <input type="text" id="signupName" placeholder="Full Name">
            <input type="email" id="signupEmail" placeholder="Email">
            <input type="password" id="signupPassword" placeholder="Password">
            <button onclick="signUp()">Create Account</button>
        </div>
    </div>

    <!-- Login Modal -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal">
            <button class="close-btn" onclick="closeModal('login')">&times;</button>
            <h2>Login</h2>
            <div class="error-text" id="loginError"></div>
            <input type="email" id="loginEmail" placeholder="Email">
            <input type="password" id="loginPassword" placeholder="Password">
            <button onclick="logIn()">Login</button>
        </div>
    </div>

    <script>
        function openModal(type) {
            document.getElementById(type + 'Modal').classList.add('active');
        }

        function closeModal(type) {
            document.getElementById(type + 'Modal').classList.remove('active');
        }

        function getUsers() {
            const users = localStorage.getItem('classdroperUsers');
            return users ? JSON.parse(users) : [];
        }

        function saveUsers(users) {
            localStorage.setItem('classdroperUsers', JSON.stringify(users));
        }

        function signUp() {
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim().toLowerCase();
            const password = document.getElementById('signupPassword').value;
            const errorBox = document.getElementById('signupError');

            if (!name || !email || !password) {
                errorBox.textContent = "Please fill in all fields.";
                return;
            }

            const users = getUsers();
            const existing = users.find(u => u.email === email);
            if (existing) {
                errorBox.textContent = "An account with this email already exists.";
                return;
            }

            users.push({ fullName: name, email: email, password: password });
            saveUsers(users);

            localStorage.setItem('classdroperCurrentUser', JSON.stringify({ fullName: name, email: email }));

            closeModal('signup');
            updateNav();
        }

        function logIn() {
            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            const password = document.getElementById('loginPassword').value;
            const errorBox = document.getElementById('loginError');

            const users = getUsers();
            const match = users.find(u => u.email === email && u.password === password);

            if (!match) {
                errorBox.textContent = "Incorrect email or password.";
                return;
            }

            localStorage.setItem('classdroperCurrentUser', JSON.stringify({ fullName: match.fullName, email: match.email }));

            closeModal('login');
            updateNav();
        }

        function logOut() {
            localStorage.removeItem('classdroperCurrentUser');
            updateNav();
        }

        function updateNav() {
            const navButtons = document.getElementById('navButtons');
            const currentUser = localStorage.getItem('classdroperCurrentUser');

            if (currentUser) {
                const user = JSON.parse(currentUser);
                const initial = user.fullName.charAt(0).toUpperCase();
                navButtons.innerHTML = `
                    <div class="user-bubble" onclick="logOut()" title="Click to log out">
                        <div class="account-icon">${initial}</div>
                        ${user.fullName}
                    </div>
                `;
            } else {
                navButtons.innerHTML = `
                    <button class="btn btn-login" onclick="openModal('login')">Login</button>
                    <button class="btn btn-signup" onclick="openModal('signup')">Sign Up</button>
                `;
            }
        }

        updateNav();
    </script>

</body>
</html>
